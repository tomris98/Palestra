<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
:root{
  --bg:#0E1014; --surface:#171A21; --surface2:#1F232C; --line:#2A2F3A;
  --txt:#E9ECF2; --mut:#96A0B2; --acc:#4C8DF6; --ok:#22C55E;
  --tab-h:56px; --bar-h:34px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --topH:50px;
}
body{background:var(--bg);color:var(--txt);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,select{background:var(--surface2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;width:100%}
select{-webkit-appearance:none;appearance:none;padding-right:28px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2396A0B2' stroke-width='2.4' stroke-linecap='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:15px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

#top{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:var(--sat);
  background:rgba(14,16,20,.86);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid var(--line)}
#topin{height:var(--topH);display:flex;align-items:center;gap:10px;padding:0 14px}
#title{font-size:17px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pill{display:none;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;color:#0B0D10;background:#E81717}
#pill.on{display:inline-flex}
#pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.65}
#gbar{display:none;height:var(--bar-h);width:100%;position:relative;overflow:hidden;background:#E81717;
  transition:background-color .45s linear;border-top:1px solid rgba(0,0,0,.25)}
#gbar.on{display:block}
#gfill{position:absolute;left:0;bottom:0;height:4px;width:0%;background:rgba(255,255,255,.5);transition:width .25s linear}
#gtxt{position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;font-size:12px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;opacity:.82;color:#fff}
body.gb main{padding-top:calc(var(--sat) + var(--topH) + var(--bar-h) + 12px)}

main{padding:calc(var(--sat) + var(--topH) + 12px) 14px calc(var(--tab-h) + var(--sab) + 26px);max-width:720px;margin:0 auto}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;padding-bottom:var(--sab);
  background:rgba(14,16,20,.9);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line)}
#tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--mut);font-size:10px;font-weight:600}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button.sel{color:var(--acc)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.card.tipo{border-width:1.5px}
h2{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
h2:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:650}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .nw{white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border:1px solid var(--line);
  color:var(--txt);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn:active{opacity:.6}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#08130B}
.btn.dgr{color:#FF8B8B;border-color:#4A2530;background:#241419}
.btn.wide{width:100%}
.btn.s{padding:9px 13px;font-size:13.5px;border-radius:10px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.empty svg{width:42px;height:42px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.4;margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:12px -14px}
.icobtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2);
  border:1px solid var(--line);flex:none}
.icobtn svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icobtn:active{opacity:.55} .icobtn.dgr svg{stroke:#FF8B8B}

.tname{font-size:19px;font-weight:800;letter-spacing:.02em}
.tag{display:inline-flex;align-items:center;gap:6px;border:1.5px solid;border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:800;letter-spacing:.04em}
.week{display:flex;gap:4px}
.day{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:7px 1px 6px;text-align:center;background:var(--surface2);min-width:0}
.day .dl{font-size:9.5px;font-weight:700;color:var(--mut);letter-spacing:.03em}
.day .dv{font-size:9.5px;font-weight:800;margin-top:3px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
.day.today{box-shadow:0 0 0 2px var(--acc)}
.day.fatto{background:#141C18}
.day.salt{opacity:.45}
.day .dk{font-size:10px;font-weight:800;color:var(--ok);margin-top:2px;line-height:1}
.day.on{background:#16233A}

.exname{font-size:17px;font-weight:700;letter-spacing:-.01em}
.exnote{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.last{font-size:12.5px;color:var(--mut);margin-top:5px}
.last b{color:#C6CEDC;font-weight:650}
.set{display:flex;align-items:flex-end;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.set.done{opacity:.78}
.fld input.ok,input.ok{border-color:var(--ok);background:#0F2418;color:#5BE08D}
.grp{border-top:1px solid var(--line);margin-top:11px;padding-top:11px}
.grp.first{border-top:0;margin-top:8px;padding-top:0}
.rb{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.rb .cell{width:58px;flex:none}
.rb .cell span{display:block;font-size:10px;font-weight:700;color:var(--mut);text-align:center;margin-bottom:3px}
.rb .cell input{padding:9px 3px;text-align:center;font-weight:650}
.rb .pm{display:flex;gap:6px;align-self:flex-end}
.rb .pm button{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);
  color:var(--mut);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center}
.rb .pm button:active{opacity:.5}
.setn{width:22px;flex:none;font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding-bottom:11px}
.fld{flex:1;min-width:0}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.fld input{padding:9px 6px;text-align:center;font-weight:650}
.fld input.l{text-align:left;padding:10px 12px}
.wwrap{display:flex;align-items:center;gap:5px}
.wwrap button{width:32px;height:38px;flex:none;border-radius:9px;background:var(--surface2);border:1px solid var(--line);
  font-size:18px;font-weight:600;color:var(--mut);display:flex;align-items:center;justify-content:center}
.wwrap button:active{opacity:.5}
.chk{width:44px;height:38px;flex:none;border-radius:11px;border:1.5px solid var(--line);background:var(--surface2);
  display:flex;align-items:center;justify-content:center}
.chk svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:var(--ok);border-color:var(--ok)} .chk.on svg{stroke:#08130B}
.prog{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s ease}

.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:9px;font-size:14px;font-weight:650;color:var(--mut)}
.seg button.sel{background:var(--surface);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 13px;
  font-size:13px;font-weight:750;color:var(--mut);white-space:nowrap}
.vals{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.vals span{flex:none;background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.vals span b{color:var(--txt);font-weight:700}
.delta{font-size:12px;font-weight:750;border-radius:7px;padding:3px 8px;border:1px solid}
.delta.up{color:#4ADE80;border-color:#1B4030;background:#0F2418}
.delta.dn{color:#FF8B8B;border-color:#4A2530;background:#241419}
.delta.eq{color:var(--mut);border-color:var(--line);background:var(--surface2)}
svg.spark{width:100%;height:auto;display:block;margin-top:6px;touch-action:manipulation}

.tog{display:flex;align-items:center;gap:12px;padding:11px 0}
.tog+.tog{border-top:1px solid var(--line)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#7C8798;transition:transform .18s,background .18s}
.sw.on{background:var(--acc);border-color:var(--acc)} .sw.on i{transform:translateX(20px);background:#fff}

.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet.on{display:flex}
.sheet .in{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:16px 14px calc(16px + var(--sab));width:100%;max-width:720px;max-height:84vh;overflow:auto}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.pick button{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);background:var(--surface2);border-radius:13px;padding:13px}
.pick .sw2{width:15px;height:15px;border-radius:5px;flex:none}
.pick .nm{font-weight:800;font-size:15.5px;letter-spacing:.02em}
.pick .nm.reg{font-weight:650;letter-spacing:0;color:var(--txt)}
.sechd{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.grid2 button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line);
  background:var(--surface2);border-radius:12px;padding:11px 12px;text-align:left}
.grid2 .n{font-weight:700;font-size:14.5px}
.grid2 .u{font-size:11px;color:var(--mut);font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--sab) + 16px);background:#2A2F3A;color:#fff;
  border:1px solid #3A4152;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;opacity:0;
  transition:opacity .2s;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.on{opacity:1}
.warnbar{background:#3A2A12;border:1px solid #6B4F1E;color:#F5D48A;border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>

<div id="top">
  <div id="topin"><div id="title">Palestra</div>
    <button id="pill" class="mono"><span class="dot"></span><span id="pilltxt">0:00</span></button></div>
  <button id="gbar"><div id="gfill"></div><div id="gtxt"></div></button>
</div>

<main id="view"></main>
<nav id="tabs"></nav>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileimp" accept=".json,application/json" style="display:none">

<script>
(function(){
"use strict";

/* ================= storage ================= */
var KEY="palestra.v2";
var STO=(function(){
  var mem={},ok=false;
  try{window.localStorage.setItem("__p","1");window.localStorage.removeItem("__p");ok=true;}catch(e){ok=false;}
  return{ok:ok,
    get:function(k){try{return ok?window.localStorage.getItem(k):(mem[k]||null);}catch(e){return mem[k]||null;}},
    set:function(k,v){try{if(ok)window.localStorage.setItem(k,v);else mem[k]=v;}catch(e){mem[k]=v;}}};
})();
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

/* ================= tipi ================= */
var TIPI={PUSH:{c:"#F5CE4A"},PULL:{c:"#5B9CFF"},LEGS:{c:"#FF5A5A"},
          UPPER:{c:"#2FBF6B"},LOWER:{c:"#FF5A5A"},CARDIO:{c:"#FF8C33"}};
var ORD=["PUSH","PULL","LEGS","UPPER","LOWER","CARDIO"];
var REST={c:"#5A6474"};
function col(t){return t&&TIPI[t]?TIPI[t].c:REST.c;}
function isCardio(t){return t==="CARDIO";}
var GG=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];

/* misure secondarie del cardio */
var MIS={"":"—",km:"Km",m:"Metri",giri:"Giri",round:"Round",vasche:"Vasche",kcal:"Kcal"};
var MISORD=["","km","m","giri","round","vasche","kcal"];
var SUG=[
  {n:"Corsa",m:"km",d:30},{n:"Tapis roulant",m:"km",d:25},
  {n:"Cyclette",m:"km",d:30},{n:"Ellittica",m:"km",d:25},
  {n:"Camminata veloce",m:"km",d:40},{n:"Vogatore",m:"m",d:15},
  {n:"Salto della corda",m:"giri",d:10},{n:"Boxe",m:"round",d:18},
  {n:"Sacco",m:"round",d:15},{n:"Tennis",m:"",d:60},
  {n:"Padel",m:"",d:60},{n:"Nuoto",m:"vasche",d:40}
];

/* ================= stato ================= */
var DEFCFG={passo:1,autoTimer:true,beep:true,wake:true,tGiallo:90,tVerde:180};
var S;
/* Un programma e' una ROTAZIONE: una sequenza ciclica di schede (seq) piu' i giorni
   in cui ti alleni (giorni: 7 booleani lun..dom). Il segnaposto pos avanza solo quando
   completi un allenamento, cosi' saltare un giorno fa slittare la rotazione. */
function nuovoProg(nome){return{id:uid(),nome:nome||"Programma 1",
  giorni:[true,true,true,true,true,false,false],seq:[],pos:0,schede:[]};}
function lenSeq(p){return (p.seq||[]).length;}
function posOk(p){var n=lenSeq(p);return n?((p.pos||0)%n+n)%n:0;}
function schedaSeq(p,k){var n=lenSeq(p);return n?schedaById(p,p.seq[((k%n)+n)%n]):null;}
function prossima(p){return lenSeq(p)?schedaSeq(p,posOk(p)):null;}
/* dopo un allenamento la rotazione riparte da subito dopo la scheda svolta */
function avanza(p,schedaId){
  var n=lenSeq(p);if(!n)return;
  var cur=posOk(p);
  if(p.seq[cur]===schedaId){p.pos=(cur+1)%n;return;}
  var k=p.seq.indexOf(schedaId);
  if(k>=0)p.pos=(k+1)%n;
}
function inizioSettimana(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function sessioneDelGiorno(i){
  var a=inizioSettimana(),d0=new Date(a);d0.setDate(a.getDate()+i);
  var d1=new Date(d0);d1.setDate(d0.getDate()+1);
  for(var k=S.sessioni.length-1;k>=0;k--){
    var t=new Date(S.sessioni[k].data);
    if(t>=d0&&t<d1)return S.sessioni[k];
  }
  return null;
}
/* i 7 giorni della settimana corrente: il fatto per i giorni passati,
   il previsto (calcolato dalla posizione attuale) per oggi e i prossimi */
function settimana(p){
  var oggi=(new Date().getDay()+6)%7,out=[],k=0,i;
  for(i=0;i<7;i++){
    var allena=!!(p.giorni&&p.giorni[i]),ss=sessioneDelGiorno(i);
    if(ss){out.push({allena:allena,fatto:true,nome:ss.nome||ss.tipo,tipo:ss.tipo,oggi:i===oggi});continue;}
    if(i<oggi){out.push({allena:allena,saltato:allena,oggi:false});continue;}
    var sc=null;
    if(allena&&lenSeq(p)){sc=schedaSeq(p,posOk(p)+k);k++;}
    out.push({allena:allena,nome:sc?nomeScheda(p,sc):null,tipo:sc?sc.tipo:null,oggi:i===oggi});
  }
  return out;
}
function schedaById(p,id){if(!p)return null;var r=p.schede.filter(function(x){return x.id===id;});return r.length?r[0]:null;}
/* nome automatico: "PUSH" se unica, "PUSH 1" / "PUSH 2" se ce n'è più d'una */
function nomeScheda(p,s){
  if(!s)return"";
  var same=p.schede.filter(function(x){return x.tipo===s.tipo;});
  if(same.length<2)return s.tipo;
  for(var i=0;i<same.length;i++)if(same[i].id===s.id)return s.tipo+" "+(i+1);
  return s.tipo;
}
function ordinaSchede(p){p.schede.sort(function(a,b){return ORD.indexOf(a.tipo)-ORD.indexOf(b.tipo);});}
function nuovaScheda(p,tipo){var s={id:uid(),tipo:tipo,ex:[]};p.schede.push(s);ordinaSchede(p);return s;}

function seed(){
  var p=nuovoProg("Programma 1");
  var blocchi=[
    ["PUSH",[["Panca piana bilanciere",4,40,"2\" in discesa, fermo al petto"],["Lento avanti manubri",3,12,""],["Croci ai cavi",3,10,""],["French press",3,15,""]]],
    ["PULL",[["Trazioni alla sbarra",4,0,"a corpo libero, elastico se serve"],["Rematore bilanciere",4,35,""],["Lat machine presa stretta",3,45,""],["Curl bilanciere",3,20,""]]],
    ["LEGS",[["Squat bilanciere",4,50,"sotto il parallelo"],["Pressa 45°",3,120,""],["Stacco rumeno",3,50,""],["Calf in piedi",4,60,""]]]
  ];
  var ids=[];
  blocchi.forEach(function(b){
    var s={id:uid(),tipo:b[0],ex:b[1].map(function(r){return{id:uid(),nome:r[0],serie:r[1],peso:r[2],note:r[3]};})};
    p.schede.push(s);ids.push(s.id);
  });
  p.seq=[ids[0],ids[1],ids[2]];               /* PUSH → PULL → LEGS */
  p.giorni=[true,true,true,true,true,false,false];  /* lun-ven */
  p.pos=0;
  S={version:4,programmi:[p],attivoId:p.id,sessioni:[],attiva:null,cfg:JSON.parse(JSON.stringify(DEFCFG))};
}
function migra(){
  /* v2: giorni conteneva il TIPO; v3: contiene l'id della scheda */
  S.programmi.forEach(function(p){
    if(!p.schede)p.schede=[];
    p.giorni=(p.giorni||[]).map(function(g){
      if(!g||g==="REST")return"REST";
      if(schedaById(p,g))return g;
      var m=p.schede.filter(function(x){return x.tipo===g;});
      return m.length?m[0].id:"REST";
    });
    while(p.giorni.length<7)p.giorni.push("REST");
    p.giorni=p.giorni.slice(0,7);
    p.schede.forEach(function(s){s.ex.forEach(function(e){
      if(isCardio(s.tipo)&&e.mis===undefined)e.mis="km";
    });});
  });
  S.sessioni.forEach(function(ss){ if(!ss.nome)ss.nome=ss.tipo; });
  S.version=3;
}
/* v3: giorni era un elenco di schede per lun..dom. v4: rotazione (seq) + giorni buoni.
   La vecchia settimana diventa la sequenza, nell'ordine in cui era scritta. */
function migra4(){
  S.programmi.forEach(function(p){
    var vecchi=p.giorni||[],seq=[],gg=[false,false,false,false,false,false,false];
    vecchi.forEach(function(g,i){
      if(g&&g!=="REST"&&schedaById(p,g)){seq.push(g);gg[i]=true;}
    });
    p.seq=seq;p.giorni=gg;p.pos=0;
  });
  S.version=4;
}
/* un allenamento lasciato a metà con il vecchio schema (una casella peso per serie)
   viene convertito in gruppi, senza perdere le ripetizioni già scritte */
function migraAttiva(){
  var a=S.attiva;if(!a||!a.ex)return;
  a.ex.forEach(function(e){
    if(e.cardio||e.gruppi)return;
    var g=[],cur=null;
    (e.set||[]).forEach(function(s){
      var p=num(s.peso);
      if(!cur||cur.peso!==p){cur={peso:p,reps:[]};g.push(cur);}
      cur.reps.push(s.reps===""||s.reps==null?"":String(s.reps));
    });
    e.gruppi=g.length?g:[{peso:0,reps:[""]}];
    delete e.set;
  });
}
function load(){
  var raw=STO.get(KEY);
  if(raw){try{S=JSON.parse(raw);}catch(e){S=null;}}
  if(!S||!S.programmi||!S.programmi.length){seed();return;}
  if(!S.cfg)S.cfg={};
  for(var k in DEFCFG){if(S.cfg[k]===undefined)S.cfg[k]=DEFCFG[k];}
  if(!S.sessioni)S.sessioni=[];
  if(!S.attivoId||!S.programmi.filter(function(p){return p.id===S.attivoId;}).length)S.attivoId=S.programmi[0].id;
  if(S.version!==4){
    if(S.version!==3)migra();
    migra4();
    try{STO.set(KEY,JSON.stringify(S));}catch(e){}
  }
  S.programmi.forEach(function(p){
    if(!p.seq)p.seq=[];
    if(!p.giorni||p.giorni.length!==7||typeof p.giorni[0]!=="boolean")
      p.giorni=[true,true,true,true,true,false,false];
    if(typeof p.pos!=="number")p.pos=0;
  });
  migraAttiva();
}
var svTO=null;
function save(){if(svTO)clearTimeout(svTO);svTO=setTimeout(function(){STO.set(KEY,JSON.stringify(S));},180);}
function saveNow(){if(svTO)clearTimeout(svTO);STO.set(KEY,JSON.stringify(S));}
function prog(){var r=S.programmi.filter(function(p){return p.id===S.attivoId;});return r.length?r[0]:S.programmi[0];}

/* ================= util ================= */
function E(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(v,d){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:(d===undefined?0:d);}
function kg(n){if(n==null||n==="")return"";var x=Math.round(n*100)/100;return x%1===0?x.toFixed(0):String(x).replace(".",",");}
function mmss(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60,p=function(n){return n<10?"0"+n:""+n;};
  return h>0?h+":"+p(m)+":"+p(q):m+":"+p(q);}
function dataIT(iso){var d=new Date(iso),p=function(n){return n<10?"0"+n:""+n;};
  return GG[(d.getDay()+6)%7].toLowerCase()+" "+d.getDate()+" "+["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"][d.getMonth()]+" · "+d.getHours()+":"+p(d.getMinutes());}
function dataBreve(iso){var d=new Date(iso);return d.getDate()+"/"+(d.getMonth()+1);}
var toTO=null;
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  if(toTO)clearTimeout(toTO);toTO=setTimeout(function(){t.classList.remove("on");},1900);}
function ic(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>';}
var I={
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  dumb:'<path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/>',
  hist:'<path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/><path d="M12 8v4.5l3 1.8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.6 7.9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', chk:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  up:'<path d="m18 15-6-6-6 6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  play:'<path d="M6 4l14 8-14 8z"/>', edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  back:'<path d="m15 18-6-6 6-6"/>', copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  dl:'<path d="M12 3v13M7 12l5 5 5-5M4 21h16"/>', ul:'<path d="M12 21V8M7 12l5-5 5 5M4 3h16"/>',
  run:'<circle cx="15" cy="4.5" r="2"/><path d="M9.5 21l2-5.5-3-2.5.5-4.5 3.5-1.5 3 3 3 1"/><path d="M6 12l2.5-2"/>',
  swap:'<path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 0 8h-2"/><path d="m17 20 4-4-4-4"/>'
};

/* ================= cronometro ================= */
var T={run:false,t0:0,acc:0,fired:false},repsTO=null;
function tsec(){return (T.acc+(T.run?Date.now()-T.t0:0))/1000;}
function tReset(go){T.acc=0;T.fired=false;T.t0=Date.now();T.run=!!go;if(go){audioInit();wakeOn();}paint();}
function tAnnullaAvvio(){if(repsTO){clearTimeout(repsTO);repsTO=null;}}
/* tocco su pastiglia o barra: se sta andando (o non è a zero) azzera e ferma, altrimenti parte */
function tToggle(){tAnnullaAvvio();if(T.run||tsec()>0)tReset(false);else tReset(true);}
/* il cronometro riparte da zero poco dopo che hai finito di scrivere le ripetizioni */
function tAvviaDopoReps(){tAnnullaAvvio();repsTO=setTimeout(function(){repsTO=null;tReset(true);},700);}
var STOPS=[{h:0,s:82,l:50},{h:45,s:96,l:53},{h:143,s:70,l:45}];
function lerp(a,b,u){return a+(b-a)*u;}
function tColor(sec){
  var g=Math.max(1,S.cfg.tGiallo),v=Math.max(g+1,S.cfg.tVerde),a,b,u;
  if(sec<=0){a=STOPS[0];b=STOPS[0];u=0;}
  else if(sec<g){a=STOPS[0];b=STOPS[1];u=sec/g;}
  else if(sec<v){a=STOPS[1];b=STOPS[2];u=(sec-g)/(v-g);}
  else{a=STOPS[2];b=STOPS[2];u=0;}
  return{css:"hsl("+lerp(a.h,b.h,u).toFixed(1)+","+lerp(a.s,b.s,u).toFixed(1)+"%,"+lerp(a.l,b.l,u).toFixed(1)+"%)",
         h:lerp(a.h,b.h,u),l:lerp(a.l,b.l,u)};
}
function tText(c){return (c.h>28&&c.h<95&&c.l>44)?"#0B0D10":"#FFFFFF";}

var AC=null;
function audioInit(){
  if(!S.cfg.beep)return;
  try{
    if(navigator.audioSession)navigator.audioSession.type="ambient"; /* mixa con la musica */
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}
    if(AC&&AC.state==="suspended")AC.resume();
  }catch(e){}
}
function bipLungo(){
  if(!S.cfg.beep||!AC)return;
  try{
    var t=AC.currentTime,dur=2.0;
    var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();
    o.type="sine";o.frequency.value=740;o2.type="sine";o2.frequency.value=1110;g2.gain.value=.28;
    o.connect(g);o2.connect(g2);g2.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.30,t+.05);
    g.gain.setValueAtTime(.30,t+dur-.25);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
  }catch(e){}
}
var WL=null;
function wakeOn(){if(!S.cfg.wake||!navigator.wakeLock)return;
  try{navigator.wakeLock.request("screen").then(function(l){WL=l;},function(){});}catch(e){}}
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){if(T.run)wakeOn();paint();}else saveNow();});

function paint(){
  var sec=tsec(),c=tColor(sec),txt=tText(c),v=Math.max(1,S.cfg.tVerde);
  var pill=document.getElementById("pill");
  if(T.run||sec>0||S.attiva){pill.classList.add("on");pill.style.background=c.css;pill.style.color=txt;
    document.getElementById("pilltxt").textContent=mmss(sec);}
  else pill.classList.remove("on");
  var gb=document.getElementById("gbar");
  if(gb.classList.contains("on")){
    gb.style.background=c.css;
    document.getElementById("gfill").style.width=Math.min(100,sec/v*100).toFixed(1)+"%";
    var gt=document.getElementById("gtxt");gt.style.color=txt;
    gt.textContent=(!T.run&&sec===0)?"tocca per avviare":(sec>=v?"pronto":"");
  }
  if(S.cfg.beep&&T.run&&!T.fired&&sec>=S.cfg.tVerde){T.fired=true;bipLungo();}
  var el=document.getElementById("sesst");

}

/* ================= storico ================= */
function keyOf(ss){return ss.schedaId||("t:"+ss.tipo);}
/* ultima volta: prima cerca nella STESSA scheda, poi per nome esercizio ovunque */
function ultima(schedaId,exId,nome){
  var i,j,ss,e,res=null;
  function estrai(e){
    if(e.cardio)return e.fatto?{cardio:true,min:e.min,val:e.val,mis:e.mis}:null;
    var d=(e.set||[]).filter(function(x){return x.fatto;});
    return d.length?{set:d}:null;
  }
  for(i=S.sessioni.length-1;i>=0;i--){
    ss=S.sessioni[i]; if(ss.schedaId!==schedaId)continue;
    for(j=0;j<ss.ex.length;j++){e=ss.ex[j];
      if(e.exId===exId||(nome&&e.nome.toLowerCase()===String(nome).toLowerCase())){res=estrai(e);if(res)return res;}}
  }
  for(i=S.sessioni.length-1;i>=0;i--){
    ss=S.sessioni[i];
    for(j=0;j<ss.ex.length;j++){e=ss.ex[j];
      if(nome&&e.nome.toLowerCase()===String(nome).toLowerCase()){res=estrai(e);if(res)return res;}}
  }
  return null;
}
function volume(ss){var t=0;ss.ex.forEach(function(e){(e.set||[]).forEach(function(s){if(s.fatto)t+=num(s.peso)*num(s.reps);});});return t;}
/* funziona sia sulle sessioni salvate (serie piatte) sia su quella in corso (gruppi di peso) */
function conta(o){
  var f=0,t=0;
  o.ex.forEach(function(e){
    if(e.cardio){t++;if(e.fatto)f++;return;}
    if(e.gruppi){e.gruppi.forEach(function(g){g.reps.forEach(function(r){t++;if(r!=="")f++;});});return;}
    (e.set||[]).forEach(function(s){t++;if(s.fatto)f++;});
  });
  return{fatte:f,tot:t};
}
function nfatte(ss){return conta(ss).fatte;}
/* serie piatte -> gruppi con lo stesso peso, e viceversa */
function inGruppi(sets,pesoDef,nserie){
  var g=[],cur=null;
  if(sets&&sets.length){
    sets.forEach(function(s){
      var p=num(s.peso);
      if(!cur||cur.peso!==p){cur={peso:p,reps:[]};g.push(cur);}
      cur.reps.push("");
    });
    return g;
  }
  var reps=[],i;for(i=0;i<Math.max(1,Math.round(num(nserie,1)));i++)reps.push("");
  return[{peso:num(pesoDef,0),reps:reps}];
}
function daGruppi(gruppi){
  var out=[];
  gruppi.forEach(function(g){g.reps.forEach(function(r){
    out.push({peso:num(g.peso),reps:r===""?0:num(r),fatto:r!==""});});});
  return out;
}
/* "40 kg → 10, 9, 8 · 45 kg → 6" */
function riassunto(sets){
  var out=[],cur=null;
  sets.forEach(function(s){
    var p=num(s.peso);
    if(!cur||cur.p!==p){cur={p:p,r:[]};out.push(cur);}
    cur.r.push(s.reps);
  });
  return out.map(function(x){return "<b>"+E(kg(x.p))+"</b> kg → "+x.r.map(function(v){return E(v);}).join(", ");}).join(" · ");
}
function sessDiKey(k){return S.sessioni.filter(function(s){return keyOf(s)===k;});}
function schedeUsate(){
  var m={},o=[];
  S.sessioni.forEach(function(s){
    var k=keyOf(s);
    if(!m[k]){m[k]={key:k,tipo:s.tipo,nome:s.nome||s.tipo,prog:s.progNome||"",n:0};o.push(m[k]);}
    m[k].n++;m[k].nome=s.nome||s.tipo;m[k].prog=s.progNome||"";
  });
  o.sort(function(a,b){return ORD.indexOf(a.tipo)-ORD.indexOf(b.tipo)||a.nome.localeCompare(b.nome);});
  /* se due schede si chiamano uguale ma vengono da programmi diversi, distinguile */
  var cnt={};
  o.forEach(function(x){cnt[x.nome]=(cnt[x.nome]||0)+1;});
  o.forEach(function(x){x.etichetta=(cnt[x.nome]>1&&x.prog)?x.nome+" · "+x.prog:x.nome;});
  return o;
}
/* elenco di tutti gli esercizi di forza mai fatti, indipendentemente da scheda e programma */
function eserciziUsati(){
  var m={},o=[];
  S.sessioni.forEach(function(s){
    s.ex.forEach(function(e){
      if(e.cardio)return;
      if(!(e.set||[]).filter(function(x){return x.fatto;}).length)return;
      var k=e.nome.toLowerCase();
      if(!m[k]){m[k]={key:k,nome:e.nome,tipo:s.tipo,n:0};o.push(m[k]);}
      m[k].n++;m[k].tipo=s.tipo;m[k].nome=e.nome;
    });
  });
  o.sort(function(a,b){return b.n-a.n||a.nome.localeCompare(b.nome);});
  return o;
}
function andamentoEs(key){
  var pts=[],i=0;
  S.sessioni.forEach(function(s){
    s.ex.forEach(function(e){
      if(e.cardio||String(e.nome).toLowerCase()!==key)return;
      var d=(e.set||[]).filter(function(x){return x.fatto;});
      if(!d.length)return;
      var top=d[0];d.forEach(function(x){if(num(x.peso)>num(top.peso))top=x;});
      i++;
      pts.push({n:i,v:num(top.peso),data:s.data,
        det:d.map(function(x){return kg(x.peso)+"×"+x.reps;}).join(", "),
        dove:(s.nome||s.tipo)+(s.progNome?" · "+s.progNome:"")});
    });
  });
  return pts;
}
function andamento(k){
  var ss=sessDiKey(k),mappa={},ordine=[];
  ss.forEach(function(s,idx){
    s.ex.forEach(function(e){
      var kk=e.nome.toLowerCase();
      if(!mappa[kk]){mappa[kk]={nome:e.nome,cardio:!!e.cardio,pts:[]};ordine.push(kk);}
      var val=null,det="",u="kg";
      if(e.cardio){
        if(e.fatto){
          var sec=num(e.val,0);
          if(e.mis&&sec){val=sec;u=MIS[e.mis]||e.mis;}
          else{val=num(e.min,0);u="min";}
          det=(e.min?kg(e.min)+" min":"")+(e.mis&&sec?" · "+kg(sec)+" "+(MIS[e.mis]||e.mis).toLowerCase():"");
        }
      }else{
        var d=(e.set||[]).filter(function(x){return x.fatto;});
        if(d.length){
          var top=d[0];d.forEach(function(x){if(num(x.peso)>num(top.peso))top=x;});
          val=num(top.peso);det=d.map(function(x){return kg(x.peso)+"×"+x.reps;}).join(", ");
        }
      }
      if(val!==null){mappa[kk].unita=u;mappa[kk].pts.push({n:idx+1,v:val,data:s.data,det:det});}
    });
  });
  return ordine.map(function(x){return mappa[x];}).filter(function(x){return x.pts.length>0;});
}

/* sparkline: 1 serie, linea 2px, marker con anello, label solo su max e ultimo */
function spark(pts,c){
  var W=320,H=78,pl=10,pr=38,pt=16,pb=18,n=pts.length,i;
  var vals=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),lo=mn,hi=mx;
  if(hi===lo){lo=mn-1;hi=mx+1;}
  var X=function(i){return n===1?pl+(W-pl-pr)/2:pl+(W-pl-pr)*(i/(n-1));};
  var Y=function(v){return pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));};
  var iMax=0;for(i=1;i<n;i++)if(vals[i]>vals[iMax])iMax=i;
  var d="";for(i=0;i<n;i++)d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(vals[i]).toFixed(1)+" ";
  var s='<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img">';
  s+='<line x1="'+pl+'" y1="'+(H-pb+6)+'" x2="'+(W-pr)+'" y2="'+(H-pb+6)+'" stroke="#2A2F3A" stroke-width="1"/>';
  if(n>1)s+='<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  for(i=0;i<n;i++){
    var big=(i===n-1||i===iMax);
    s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="'+(big?5:3.5)+'" fill="'+c+'" stroke="#171A21" stroke-width="2"/>';
    s+='<circle class="hit" cx="'+X(i).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="15" fill="transparent" data-pt="'+i+'"/>';
  }
  var lab=function(i,anchor){
    var x=X(i),y=Y(vals[i]),ax=anchor==="end"?x-9:x+9;
    return '<text x="'+ax.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" fill="#E9ECF2" font-size="12.5" font-weight="700" text-anchor="'+(anchor==="end"?"end":"start")+'">'+E(kg(vals[i]))+'</text>';
  };
  s+=lab(n-1,"start");
  if(iMax!==n-1)s+=lab(iMax,iMax===0?"start":"end");
  s+='<text x="'+pl+'" y="'+(H-2)+'" fill="#96A0B2" font-size="10.5" font-weight="700">#1</text>';
  if(n>1)s+='<text x="'+(W-pr)+'" y="'+(H-2)+'" fill="#96A0B2" font-size="10.5" font-weight="700" text-anchor="end">#'+n+'</text>';
  return s+'</svg>';
}

function vSto(){
  var h='<div class="seg"><button data-act="sto-sessioni" class="'+(V.stoSub==="sessioni"?"sel":"")+'">Sessioni</button>'
    +'<button data-act="sto-and" class="'+(V.stoSub==="and"?"sel":"")+'">Andamento</button></div>';

  var cnt={},pgs={},piuProg=false;

    if(s.progNome)pgs[s.progNome]=1;});

function vAnd(){
  if(!S.sessioni.length)return '<div class="empty">'+ic(I.hist)+'<div class="b" style="color:var(--txt)">Nessun dato</div><div class="sm" style="margin-top:6px">Completa almeno un allenamento.</div></div>';

    +'<button data-act="and-scheda" class="'+(V.andSub!=="es"?"sel":"")+'">Per scheda</button>'
    +'<button data-act="and-es" class="'+(V.andSub==="es"?"sel":"")+'">Per esercizio</button></div>';

  }).join("")+'</div>';
  var cur=sk.filter(function(x){return x.key===V.selKey;})[0],c=col(cur.tipo),n=cur.n;
  h+='<div class="sm mut" style="margin:0 2px 12px">'+n+' session'+(n===1?"e":"i")+' di <b style="color:'+c+'">'+E(cur.nome)+'</b>'
    +(cur.prog?' nel programma <b>'+E(cur.prog)+'</b>':'')+', dalla #1 alla #'+n+'.</div>';
  var lista=andamento(V.selKey);
  if(!lista.length)return h+'<div class="empty" style="padding:24px">'+ic(I.dumb)+'<div class="sm">Nessuna serie completata.</div></div>';
  lista.forEach(function(x,xi){

      +(pts.length>1?'<div class="delta '+cls+' nw">'+(d>0?"+":"")+kg(d)+' '+E(u.toLowerCase())+'</div>':'')+'</div>'
      +spark(pts,c)

      +'<div class="xs mut" data-cap="'+xi+'" style="margin-top:8px">Ultima: '+E(pts[pts.length-1].det||"")+' · '+E(dataBreve(pts[pts.length-1].data))+'</div></div>';
  });
  return h;
}

        return '<button data-act="seqsel" data-id="'+s.id+'" style="border-color:'+c+'">'
          +'<div class="sw2" style="background:'+c+'"></div><div class="nm" style="color:'+c+'">'+E(nomeScheda(p,s))+'</div>'
          +'<div class="grow"></div><div class="xs mut nw">'+s.ex.length+(isCardio(s.tipo)?" att.":" es.")+'</div></button>';
      }).join("")+'</div>';
  }
  h+='<div class="sechd">Crea una nuova scheda</div><div class="pick">'+ORD.map(function(t){return rigaTipo(t,"seqnew");}).join("")+'</div>';
  sheetOpen(h+'<button class="btn wide" data-act="sheetx" style="margin-top:14px">Annulla</button>');
}
function pickCardio(){
  var h='<div class="b" style="font-size:17px">Che attività aggiungi?</div><div class="grid2">'
    +SUG.map(function(s,i){
      return '<button data-act="cardsel" data-id="'+i+'"><div class="n">'+E(s.n)+'</div>'
        +'<div class="u">'+s.d+' min'+(s.m?' · '+MIS[s.m].toLowerCase():'')+'</div></button>';
    }).join("")+'</div>'
    +'<div class="pick"><button data-act="cardsel" data-id="-1" style="border-color:var(--line)">'
    +'<div class="nm reg">Altro — scrivo io il nome</div></button></div>';
  sheetOpen(h+'<button class="btn wide" data-act="sheetx" style="margin-top:14px">Annulla</button>');
}

/* ================= azioni ================= */
function startSess(sid){
  var p=prog(),s=schedaById(p,sid);
  if(!s)return;
  if(!s.ex.length){toast("Questa scheda è vuota");return;}
  var card=isCardio(s.tipo);
  S.attiva={id:uid(),progId:p.id,progNome:p.nome,schedaId:s.id,tipo:s.tipo,nome:nomeScheda(p,s),start:Date.now(),
    ex:s.ex.map(function(e){
      var u=ultima(s.id,e.id,e.nome);
      if(card)return{exId:e.id,nome:e.nome,note:e.note||"",cardio:true,mis:e.mis||"",target:e.serie,
        min:(u&&u.cardio?num(u.min,""):(num(e.serie,"")||"")),
        val:(u&&u.cardio&&u.mis===(e.mis||"")?num(u.val,""):""),fatto:false};
      /* i pesi dell'ultima volta diventano gruppi: pesi uguali di fila = una casella peso sola */
      return{exId:e.id,nome:e.nome,note:e.note||"",gruppi:inGruppi(u&&u.set,e.peso,e.serie)};
    })};
  saveNow();go("workout");
}
function fineSess(){
  var a=S.attiva;if(!a)return;
  if(!nfatte(a)){if(!confirm("Non hai completato niente. Chiudere senza salvare?"))return;
    S.attiva=null;saveNow();go("workout");return;}
  S.sessioni.push({id:a.id,progId:a.progId,progNome:a.progNome,schedaId:a.schedaId,tipo:a.tipo,nome:a.nome,
    data:new Date().toISOString(),durata:Math.round((Date.now()-a.start)/1000),
    ex:a.ex.map(function(e){
      if(e.cardio)return{exId:e.exId,nome:e.nome,note:e.note,cardio:true,mis:e.mis||"",min:num(e.min,0),val:num(e.val,0),fatto:!!e.fatto};
      return{exId:e.exId,nome:e.nome,note:e.note,set:daGruppi(e.gruppi||[])};
    })});
  if(S.sessioni.length>400)S.sessioni=S.sessioni.slice(-400);
  /* la rotazione avanza solo qui: se salti un giorno, il giorno dopo ritrovi la stessa scheda */
  var pp=S.programmi.filter(function(x){return x.id===a.progId;})[0];
  if(pp)avanza(pp,a.schedaId);
  S.attiva=null;saveNow();toast("Allenamento salvato");V.stoSub="sessioni";go("storico");
}
function dl(name,text,mime){
  try{var b=new Blob([text],{type:mime||"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},1500);}catch(e){toast("Download non riuscito");}
}
function csv(){
  var r=[["data","programma","scheda","tipo","esercizio","serie","peso_kg","ripetizioni","minuti","misura","valore"]];
  S.sessioni.forEach(function(ss){ss.ex.forEach(function(e){
    if(e.cardio){if(e.fatto)r.push([ss.data,ss.progNome||"",ss.nome||ss.tipo,ss.tipo,e.nome,"","","",num(e.min),MIS[e.mis||""]||"",num(e.val)]);}
    else (e.set||[]).forEach(function(s,i){if(s.fatto)r.push([ss.data,ss.progNome||"",ss.nome||ss.tipo,ss.tipo,e.nome,i+1,num(s.peso),num(s.reps),"","",""]);});
  });});
  var t=r.map(function(x){return x.map(function(c){var v=String(c);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(";");}).join("\n");
  dl("palestra-storico.csv","﻿"+t,"text/csv;charset=utf-8");
}

document.getElementById("gbar").addEventListener("click",tToggle);
document.getElementById("pill").addEventListener("click",tToggle);
document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]");if(!b)return;go(b.getAttribute("data-tab"));});

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),id=el.getAttribute("data-id");
  var i=parseInt(el.getAttribute("data-i"),10),j=parseInt(el.getAttribute("data-j"),10);
  var P=prog(),A=S.attiva;
  var PE=(V.tab==="programma"&&V.sub==="edit")?S.programmi.filter(function(x){return x.id===V.arg;})[0]:null;
  var host=PE||P;

  if(a==="sheetx"){sheetClose();return;}
  /* programma */
  if(a==="pnew"){var np=nuovoProg("Programma "+(S.programmi.length+1));S.programmi.push(np);S.attivoId=np.id;saveNow();go("programma","edit",np.id);return;}
  if(a==="pedit"){go("programma","edit",id);return;}
  if(a==="patt"){S.attivoId=id;saveNow();toast("Programma attivo cambiato");render();return;}
  if(a==="goprog"){go("programma");return;}
  if(a==="gday"&&PE){PE.giorni[i]=!PE.giorni[i];saveNow();render();return;}
  if(a==="sqadd"&&PE){V.seqIdx=-1;pickPasso(PE,"Quale scheda aggiungi in fondo?");return;}
  if(a==="seqchg"&&PE){V.seqIdx=i;pickPasso(PE,"Sostituisci il passo "+(i+1)+" con…");return;}
  if(a==="seqsel"&&PE){
    if(V.seqIdx>=0)PE.seq[V.seqIdx]=id;else PE.seq.push(id);
    saveNow();sheetClose();render();return;}
  if(a==="seqnew"&&PE){
    var ns=nuovaScheda(PE,id);
    if(V.seqIdx>=0)PE.seq[V.seqIdx]=ns.id;else PE.seq.push(ns.id);
    saveNow();sheetClose();render();return;}
  if((a==="squp"||a==="sqdn")&&PE){
    var t3=a==="squp"?i-1:i+1;if(t3<0||t3>=PE.seq.length)return;
    var tmp3=PE.seq[i];PE.seq[i]=PE.seq[t3];PE.seq[t3]=tmp3;saveNow();render();return;}
  if(a==="sqdel"&&PE){PE.seq.splice(i,1);if(PE.pos>=PE.seq.length)PE.pos=0;saveNow();render();return;}
  if(a==="sqreset"&&PE){PE.pos=0;saveNow();render();toast("Rotazione riportata al primo passo");return;}
  if(a==="pdup"&&PE){
    var cp=JSON.parse(JSON.stringify(PE)),map={};
    cp.id=uid();cp.nome=PE.nome+" (copia)";
    cp.schede.forEach(function(s){var old=s.id;s.id=uid();map[old]=s.id;s.ex.forEach(function(e){e.id=uid();});});
    cp.seq=(cp.seq||[]).map(function(g){return map[g];}).filter(Boolean);
    cp.pos=0;
    S.programmi.push(cp);saveNow();toast("Programma duplicato");go("programma");return;}
  if(a==="pdel"&&PE){if(!confirm('Eliminare "'+PE.nome+'"? Lo storico resta.'))return;
    S.programmi=S.programmi.filter(function(x){return x.id!==PE.id;});
    if(S.attivoId===PE.id)S.attivoId=S.programmi[0].id;saveNow();go("programma");return;}
  if(a==="pdone"){saveNow();go("programma");return;}

  /* schede */
  if(a==="saddtipo"){sheetOpen('<div class="b" style="font-size:17px">Che scheda aggiungi?</div>'
    +'<div class="sm mut" style="margin-top:5px">Puoi ripetere lo stesso tipo: diventeranno PUSH 1, PUSH 2…</div>'
    +'<div class="pick">'+ORD.map(function(t){return rigaTipo(t,"saddsel");}).join("")+'</div>'
    +'<button class="btn wide" data-act="sheetx" style="margin-top:14px">Annulla</button>');return;}
  if(a==="saddsel"){nuovaScheda(host,id);saveNow();sheetClose();render();return;}
  if(a==="sdelete"&&PE){if(!confirm("Eliminare questa scheda? Esce anche dalla rotazione, lo storico resta."))return;
    PE.schede=PE.schede.filter(function(x){return x.id!==id;});
    PE.seq=(PE.seq||[]).filter(function(x){return x!==id;});
    if(PE.pos>=PE.seq.length)PE.pos=0;
    saveNow();render();return;}
  if(a==="sedit"){go("scheda","edit",id);return;}
  if(a==="sdone"){saveNow();go("scheda");return;}
  var SC=(V.tab==="scheda"&&V.sub==="edit")?schedaById(P,V.arg):null;
  if(a==="exadd"&&SC){SC.ex.push({id:uid(),nome:"",serie:3,peso:20,note:""});saveNow();render();return;}
  if(a==="cardadd"&&SC){V.cardCtx={dove:"scheda"};pickCardio();return;}
  if(a==="cardsel"){
    var k=parseInt(id,10),su=k>=0?SUG[k]:null,ctx=V.cardCtx||{dove:"scheda"};
    if(ctx.dove==="scheda"&&SC){
      SC.ex.push({id:uid(),nome:su?su.n:"",serie:su?su.d:20,peso:0,mis:su?su.m:"",note:""});
    }else if(ctx.dove==="sess"&&A){
      A.ex.push({exId:uid(),nome:su?su.n:"",note:"",cardio:true,mis:su?su.m:"",
        target:su?su.d:"",min:su?su.d:"",val:"",fatto:false});
    }else if(ctx.dove==="sesschg"&&A&&A.ex[ctx.i]){
      var ce=A.ex[ctx.i];
      if(su){ce.nome=su.n;ce.mis=su.m;ce.target=su.d;if(ce.min==="")ce.min=su.d;}
      ce.val="";
    }
    saveNow();sheetClose();render();return;}
  if(a==="exdel"&&SC){SC.ex=SC.ex.filter(function(x){return x.id!==id;});saveNow();render();return;}
  if((a==="exup"||a==="exdn")&&SC){
    var kk=-1;SC.ex.forEach(function(x,n){if(x.id===id)kk=n;});
    var t2=a==="exup"?kk-1:kk+1;if(kk<0||t2<0||t2>=SC.ex.length)return;
    var tm=SC.ex[kk];SC.ex[kk]=SC.ex[t2];SC.ex[t2]=tm;saveNow();render();return;}

  /* workout */
  if(a==="start"){startSess(id);return;}
  if(a==="cchk"&&A){A.ex[i].fatto=!A.ex[i].fatto;saveNow();render();return;}
  var g=parseInt(el.getAttribute("data-g"),10);
  if(a==="w+"&&A){var G1=A.ex[i].gruppi[g];G1.peso=Math.max(0,num(G1.peso)+num(S.cfg.passo,1));saveNow();render();return;}
  if(a==="w-"&&A){var G2=A.ex[i].gruppi[g];G2.peso=Math.max(0,num(G2.peso)-num(S.cfg.passo,1));saveNow();render();return;}
  if(a==="radd"&&A){A.ex[i].gruppi[g].reps.push("");saveNow();render();return;}
  if(a==="rdel"&&A){var G3=A.ex[i].gruppi[g];if(G3.reps.length>1){G3.reps.pop();saveNow();render();}return;}
  if(a==="gadd"&&A){var gg=A.ex[i].gruppi,ul=gg[gg.length-1];
    gg.push({peso:ul?num(ul.peso):0,reps:[""]});saveNow();render();return;}
  if(a==="gdel"&&A){if(A.ex[i].gruppi.length>1){A.ex[i].gruppi.splice(g,1);saveNow();render();}return;}
  /* cardio dentro l'allenamento: aggiungi, cambia attività, togli */
  if(a==="addcardio"&&A){V.cardCtx={dove:"sess"};pickCardio();return;}
  if(a==="cchange"&&A){V.cardCtx={dove:"sesschg",i:i};pickCardio();return;}
  if(a==="cdel"&&A){if(!confirm("Togliere questa voce dall'allenamento?"))return;
    A.ex.splice(i,1);saveNow();render();return;}
  if(a==="fine"){fineSess();return;}
  if(a==="annulla"){if(confirm("Annullare l'allenamento? Non verrà salvato.")){S.attiva=null;saveNow();go("workout");}return;}

  /* storico */
  if(a==="sto-sessioni"){V.stoSub="sessioni";render();return;}
  if(a==="sto-and"){V.stoSub="and";render();return;}
  if(a==="and-scheda"){V.andSub="scheda";render();return;}
  if(a==="and-es"){V.andSub="es";render();return;}
  if(a==="selk"){V.selKey=id;render();return;}
  if(a==="sele"){V.selEs=id;render();return;}
  if(a==="sdet"){go("storico","det",id);return;}
  if(a==="sback"){go("storico");return;}
  if(a==="sesdel"){if(!confirm("Eliminare questo allenamento?"))return;
    S.sessioni=S.sessioni.filter(function(x){return x.id!==id;});saveNow();go("storico");return;}

  /* opzioni */
  if(a&&a.indexOf("t-")===0){var ck=a.slice(2);S.cfg[ck]=!S.cfg[ck];saveNow();
    if(ck==="beep"&&S.cfg.beep){audioInit();setTimeout(bipLungo,80);}render();return;}
  if(a==="bkp"){dl("palestra-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(S,null,1),"application/json");return;}
  if(a==="csv"){csv();return;}
  if(a==="imp"){document.getElementById("fileimp").click();return;}
  if(a==="wipe"){if(!confirm("Cancellare programmi, schede e storico? Irreversibile."))return;seed();saveNow();go("programma");toast("Dati cancellati");return;}
});

/* input / select senza rerender */
function applica(el){
  var f=el.getAttribute("data-f"),cf=el.getAttribute("data-cfg"),
      pf=el.getAttribute("data-pf"),cc=el.getAttribute("data-cf"),cn=el.getAttribute("data-cn");
  if(pf){var PE=S.programmi.filter(function(x){return x.id===V.arg;})[0];if(PE){PE.nome=el.value;save();}return;}
  if(cf){var v=num(el.value,null);if(v!==null&&v>=0){S.cfg[cf]=cf==="passo"?v:Math.round(v);save();}return;}
  if(f){
    var SC=schedaById(prog(),V.arg);if(!SC)return;
    var e=SC.ex.filter(function(x){return x.id===el.getAttribute("data-ex");})[0];if(!e)return;
    if(f==="nome")e.nome=el.value;
    else if(f==="serie")e.serie=Math.max(1,Math.min(300,Math.round(num(el.value,1))));
    else if(f==="peso")e.peso=num(el.value,0);
    else if(f==="note")e.note=el.value;
    else if(f==="mis")e.mis=el.value;
    save();return;}
  if(el.getAttribute("data-gf")&&S.attiva){
    var gi=parseInt(el.getAttribute("data-i"),10),gg=parseInt(el.getAttribute("data-g"),10);
    var G=S.attiva.ex[gi]&&S.attiva.ex[gi].gruppi[gg];if(!G)return;
    G.peso=num(el.value,0);save();return;}
  if(el.getAttribute("data-rf")&&S.attiva){
    var ri=parseInt(el.getAttribute("data-i"),10),rg=parseInt(el.getAttribute("data-g"),10),rr=parseInt(el.getAttribute("data-r"),10);
    var GR=S.attiva.ex[ri]&&S.attiva.ex[ri].gruppi[rg];if(!GR)return;
    var raw=String(el.value).replace(/[^0-9]/g,"");
    GR.reps[rr]=raw===""?"":String(Math.max(0,Math.min(999,parseInt(raw,10))));
    var pieno=GR.reps[rr]!=="";
    el.className="mono"+(pieno?" ok":"");
    /* il cronometro riparte da zero poco dopo che hai finito di scrivere il valore */
    if(pieno&&S.cfg.autoTimer)tAvviaDopoReps(); else if(!pieno)tAnnullaAvvio();
    refreshStato();save();return;}
  if(cn!==null&&cn!==undefined&&S.attiva){
    var ni=parseInt(cn,10),ne=S.attiva.ex[ni];if(!ne)return;
    ne.nome=el.value;save();return;}
  if(cc&&S.attiva){
    var i2=parseInt(el.getAttribute("data-i"),10),e2=S.attiva.ex[i2];if(!e2)return;
    e2[cc]=el.value===""?"":num(el.value,0);save();return;}
}
document.addEventListener("input",function(ev){if(ev.target.tagName==="INPUT")applica(ev.target);});
document.addEventListener("change",function(ev){if(ev.target.tagName==="SELECT")applica(ev.target);});

document.getElementById("fileimp").addEventListener("change",function(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(String(r.result));
      if(!d||!d.programmi)throw 0;
      if(!confirm("Sostituire i dati attuali con il backup?"))return;
      S=d;if(!S.cfg)S.cfg={};for(var k in DEFCFG){if(S.cfg[k]===undefined)S.cfg[k]=DEFCFG[k];}
      if(!S.sessioni)S.sessioni=[];
      if(!S.attivoId)S.attivoId=S.programmi[0].id;
      if(S.version!==3)migra();
      saveNow();go("programma");toast("Backup ripristinato");
    }catch(e){toast("File non valido");}};
  r.readAsText(f);ev.target.value="";
});
